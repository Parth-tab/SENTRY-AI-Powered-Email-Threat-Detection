name: SENTRY Release & Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Explicit image tag to publish (default: 1.1.0)'
        required: false
        default: '1.1.0'

jobs:
  publish:
    name: Build & Push Production Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Metadata & Normalize Repository Owner
        id: meta
        shell: bash
        run: |
          # 1. Lowercase repository owner for GHCR compatibility
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=${OWNER_LOWER}" >> $GITHUB_OUTPUT

          # 2. Derive version tag: input -> tag ref -> default
          if [ -n "${{ inputs.image_tag }}" ]; then
            VERSION="${{ inputs.image_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.1.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Derived GHCR Owner: ${OWNER_LOWER}, Version: ${VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (Multi-Arch Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Publish Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.OWNER }}/sentry-backend:latest
            ghcr.io/${{ steps.meta.outputs.OWNER }}/sentry-backend:${{ steps.meta.outputs.VERSION }}

      - name: Build & Publish Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.OWNER }}/sentry-frontend:latest
            ghcr.io/${{ steps.meta.outputs.OWNER }}/sentry-frontend:${{ steps.meta.outputs.VERSION }}

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SENTRY Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
