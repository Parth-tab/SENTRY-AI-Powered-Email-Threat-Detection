version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentry_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentry_secret_2025}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentry} -d ${POSTGRES_DB:-sentry_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18-community
    container_name: sentry-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/sentry_graph_2025}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4jdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentry-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentry}:${POSTGRES_PASSWORD:-sentry_secret_2025}@postgres:5432/${POSTGRES_DB:-sentry_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-sentry}:${POSTGRES_PASSWORD:-sentry_secret_2025}@postgres:5432/${POSTGRES_DB:-sentry_db}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sentry_graph_2025}
      SECRET_KEY: ${SECRET_KEY:-sentry_super_secret_jwt_key_hackathon_2025}
      EVIDENCE_VAULT_DIR: /app/evidence_vault
    volumes:
      - ./backend:/app
      - ./evidence_vault:/app/evidence_vault
      - ./sample_emails:/app/sample_emails
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentry-celery-worker
    restart: unless-stopped
    command: celery -A app.services.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentry}:${POSTGRES_PASSWORD:-sentry_secret_2025}@postgres:5432/${POSTGRES_DB:-sentry_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-sentry}:${POSTGRES_PASSWORD:-sentry_secret_2025}@postgres:5432/${POSTGRES_DB:-sentry_db}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sentry_graph_2025}
      EVIDENCE_VAULT_DIR: /app/evidence_vault
    volumes:
      - ./backend:/app
      - ./evidence_vault:/app/evidence_vault
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentry-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/api/v1/dashboard/live
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  neo4jdata:
